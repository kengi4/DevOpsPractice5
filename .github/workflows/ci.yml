name: CI

# Запускати пайплайн при кожному push до гілки main
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Завантаження коду репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Встановлення Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Встановлення залежностей
      - name: Install dependencies
        run: npm install

      # 4. Запуск білду
      - name: Build project
        run: npm run build

      # 5. Перевірка, що білд завершився успішно і результат існує
      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Build failed: dist/index.html not found"
            exit 1
          fi
          echo "Build succeeded. Contents of dist/:"
          ls -la dist
          cat dist/index.html

      # 6. Збереження результату білду як артефакту
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

      # 7. Декодування SSH-ключа для підключення до EC2
      - name: Decode SSH key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          if [ -z "$EC2_SSH_KEY_B64" ]; then
            echo "Error: EC2_SSH_KEY_B64 secret is not set"
            exit 1
          fi
          printf '%s' "$EC2_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ec2-key.pem
          chmod 600 ec2-key.pem

      # 8. Копіювання файлів проєкту на сервер EC2
      - name: Copy project files to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='ec2-key.pem' \
            --rsync-path="mkdir -p /home/${{ secrets.EC2_USER }}/nodeapp && rsync" \
            -e "ssh -i ec2-key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/nodeapp

      # 9. Встановлення залежностей та запуск застосунку на EC2
      - name: Deploy and start application on EC2
        run: |
          ssh -i ec2-key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi
            cd "$HOME/nodeapp"
            npm install
            if pm2 describe index >/dev/null 2>&1; then
              pm2 restart index
            else
              pm2 start index.js --name index
            fi
            pm2 status
          EOF
